seed: 1
num_worker: 2
work_dir: work_dirs/fine_tennis10/v2_joint
visual_dir: work_dirs/fine_tennis10/v2_joint/visualizations
phase: train
train_use_sampler: true
class_weight_beta: 0.999
feeder: feeders.fine_tennis10_v2.Feeder
train_feeder_args:
  data_path: ./data/Fine-Tennis10/dataset/train/
  ball_data_path: ./data/Fine-Tennis10/dataset/ball/
  label_file: data/Fine-Tennis10/dataset/labels.txt
  split: train
  data_type: j
  debug: false
  window_size: 64
  p_interval:
  - 0.5
  - 1
  aug_method: a123589
  intra_p: 0.5
  inter_p: 0.1
  thres: 64
  uniform: true
  partition: false
  dataset: h36m
  ball_jitter_std: 0.005
  ball_drop_prob: 0.1
  ball_drop_max_ratio: 0.15
  ball_impute_mode: linear
  image_wh:
  - 1920.0
  - 1080.0
  num_joints: 17
  use_kendall: false
  kendall_ref_path: null
test_feeder_args:
  data_path: ./data/Fine-Tennis10/dataset/test/
  ball_data_path: ./data/Fine-Tennis10/dataset/ball/
  label_file: data/Fine-Tennis10/dataset/labels.txt
  split: test
  data_type: j
  window_size: 64
  p_interval:
  - 0.95
  thres: 64
  uniform: true
  partition: false
  debug: false
  dataset: h36m
  ball_jitter_std: 0.0
  ball_drop_prob: 0.0
  ball_drop_max_ratio: 0.0
  ball_impute_mode: linear
  image_wh:
  - 1920.0
  - 1080.0
  num_joints: 17
  use_kendall: false
  kendall_ref_path: null
model: models.strokenet_v2.StrokeNet_
model_args:
  in_channels: 3
  embed_dim: 192
  stage_dims:
  - 192
  - 256
  - 384
  - 512
  num_classes: 10
  d_state: 128
  d_conv: 4
  expand: 1
  mlp_ratio: 2.0
  drop: 0.1
  bimamba_type: v2
  headdim: 48
  headdim_256: 32
  headdim_384: 48
  headdim_512: 64
  rmsnorm: true
  downsample_strides:
  - 1
  - 2
  - 2
  - 2
  ball_input_dim: 7
  cross_modal_dim: 64
  ball_tcn_depth: 3
  ball_tcn_drop: 0.2
  num_joints: 17
  share_weights: true
  share_weights_per_stage:
  - true
  - true
  - true
  - true
  mlp_ratio_per_stage:
  - 2.0
  - 2.0
  - 2.0
  - 2.5
  expand_per_stage:
  - 1
  - 1
  - 1
  - 1
  kendall_transform_type: none
  window_size: 64
optimizer: AdamW
weight_decay: 0.08
lr_scheduler: cosine
base_lr: 3e-4
min_lr: 1e-6
warmup_lr: 1e-8
warmup_prefix: false
warm_up_epoch: 25
device:
- 0
batch_size: 128
test_batch_size: 128
num_epoch: 300
nesterov: true
grad_clip: true
grad_max: 1.0
loss_type: LSCE
ema: true
ema_decay: 0.999
ema_use_for_eval: true
center_loss: true
center_loss_weight: 0.03
center_alpha: 0.3
center_feat_norm: false
best_metric: top1
show_topk:
- 1
- 2
- 5
